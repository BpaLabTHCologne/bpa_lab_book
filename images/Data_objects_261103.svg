<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2580 1110" width="2580" height="1110" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebfa"/><stop offset="1" stop-color="#bcdbf4"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2f2de"/><stop offset="1" stop-color="#c8e7c1"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf5d6"/><stop offset="1" stop-color="#fbe6a4"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/></marker>
    <marker id="sm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/></marker>
  </defs>
  <rect width="2580" height="1110" fill="#ffffff"/>

  <!-- Panels -->
  <rect x="25" y="25" width="2525" height="575" rx="40" fill="#f8f9fb" stroke="#dfe3e8" stroke-width="2.5"/>
  <rect x="25" y="620" width="2525" height="225" rx="40" fill="#f8f9fb" stroke="#dfe3e8" stroke-width="2.5"/>
  <rect x="25" y="865" width="2525" height="220" rx="40" fill="#f8f9fb" stroke="#dfe3e8" stroke-width="2.5"/>

  <!-- Section labels -->
  <g font-size="30" font-weight="bold" fill="#1f2a3c">
    <text x="62" y="320">Data sources</text>
    <text x="62" y="745">Data categories</text>
    <text x="62" y="985">Data objects</text>
  </g>
  <g fill="#7c3aed">
    <rect x="62" y="336" width="65" height="5" rx="2.5"/>
    <rect x="62" y="761" width="65" height="5" rx="2.5"/>
    <rect x="62" y="1001" width="65" height="5" rx="2.5"/>
  </g>

  <!-- Source systems -->
  <rect x="359" y="57" width="815" height="118" rx="18" fill="url(#gBlue)" stroke="#2b7bc0" stroke-width="3"/>
  <text x="766" y="126" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">Process applications</text>

  <rect x="1223" y="57" width="554" height="118" rx="18" fill="url(#gGreen)" stroke="#3c9a3c" stroke-width="3"/>
  <text x="1500" y="110" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">BPMS</text>
  <text x="1500" y="148" font-size="24" fill="#3a4556" text-anchor="middle">(Camunda 8)</text>

  <rect x="1818" y="57" width="587" height="118" rx="18" fill="url(#gYellow)" stroke="#d4a72c" stroke-width="3"/>
  <text x="2111" y="126" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">FT-Factory</text>

  <rect x="1818" y="270" width="587" height="105" rx="18" fill="url(#gYellow)" stroke="#d4a72c" stroke-width="3"/>
  <text x="2111" y="333" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">MQTT-Broker</text>

  <rect x="1818" y="470" width="587" height="105" rx="18" fill="url(#gYellow)" stroke="#d4a72c" stroke-width="3"/>
  <text x="2111" y="533" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">MongoDB</text>

  <!-- MySQL DBMS container with two schemas -->
  <rect x="359" y="285" width="1418" height="290" rx="18" fill="#eaf2fb" stroke="#2b7bc0" stroke-width="3"/>
  <text x="1068" y="340" font-size="30" font-weight="bold" fill="#1f2a3c" text-anchor="middle">MySQL</text>
  <text x="1068" y="372" font-size="20" fill="#3a4556" text-anchor="middle">(DBMS)</text>

  <rect x="385" y="395" width="765" height="155" rx="14" fill="url(#gBlue)" stroke="#2b7bc0" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="767" y="465" font-size="27" font-weight="bold" fill="#1f2a3c" text-anchor="middle">Application schema</text>
  <text x="767" y="502" font-size="22" fill="#3a4556" text-anchor="middle">(process application data)</text>

  <rect x="1247" y="395" width="505" height="155" rx="14" fill="url(#gGreen)" stroke="#3c9a3c" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="1500" y="465" font-size="27" font-weight="bold" fill="#1f2a3c" text-anchor="middle">BPMS schema</text>
  <text x="1500" y="502" font-size="22" fill="#3a4556" text-anchor="middle">(process execution data)</text>

  <!-- Source arrows -->
  <g stroke="#4a5260" stroke-width="2.5" fill="none">
    <line x1="766" y1="175" x2="766" y2="393" marker-end="url(#ah)"/>
    <line x1="1500" y1="175" x2="1500" y2="393" marker-end="url(#ah)"/>
    <line x1="2111" y1="175" x2="2111" y2="268" marker-end="url(#ah)"/>
    <line x1="2111" y1="375" x2="2111" y2="468" marker-end="url(#ah)"/>

    <!-- Application schema -> categories -->
    <polyline points="767,550 767,652"/>
    <polyline points="481,690 481,652 1052,652 1052,688" marker-end="url(#ah)"/>
    <line x1="481" y1="652" x2="481" y2="688" marker-end="url(#ah)"/>
    <line x1="766" y1="652" x2="766" y2="688" marker-end="url(#ah)"/>
    <!-- BPMS schema -> categories -->
    <polyline points="1500,550 1500,652"/>
    <polyline points="1350,688 1350,652 1649,652 1649,688" marker-end="url(#ah)"/>
    <line x1="1350" y1="652" x2="1350" y2="688" marker-end="url(#ah)"/>
    <!-- MongoDB -> categories -->
    <polyline points="2111,575 2111,652"/>
    <polyline points="1954,688 1954,652 2268,652 2268,688" marker-end="url(#ah)"/>
    <line x1="1954" y1="652" x2="1954" y2="688" marker-end="url(#ah)"/>
  </g>

  <!-- Categories -->
  <g font-size="26" fill="#1f2a3c" text-anchor="middle">
    <rect x="359" y="690" width="244" height="108" rx="18" fill="url(#gBlue)" stroke="#2b7bc0" stroke-width="3"/>
    <text x="481" y="753">Transactional data</text>
    <rect x="645" y="690" width="243" height="108" rx="18" fill="url(#gBlue)" stroke="#2b7bc0" stroke-width="3"/>
    <text x="766" y="753">Stock data</text>
    <rect x="931" y="690" width="243" height="108" rx="18" fill="url(#gBlue)" stroke="#2b7bc0" stroke-width="3"/>
    <text x="1052" y="753">Master data</text>
    <rect x="1223" y="690" width="256" height="108" rx="18" fill="url(#gGreen)" stroke="#3c9a3c" stroke-width="3"/>
    <text x="1350" y="753">Event data</text>
    <rect x="1521" y="690" width="256" height="108" rx="18" fill="url(#gGreen)" stroke="#3c9a3c" stroke-width="3"/>
    <text x="1649" y="753">Process variables</text>
    <rect x="1818" y="690" width="272" height="108" rx="18" fill="url(#gYellow)" stroke="#d4a72c" stroke-width="3"/>
    <text x="1954" y="753">Status data</text>
    <rect x="2133" y="690" width="272" height="108" rx="18" fill="url(#gYellow)" stroke="#d4a72c" stroke-width="3"/>
    <text x="2269" y="753">Stock data</text>
  </g>

  <!-- Data objects -->
  <g fill="none" stroke-width="2.5">
    <g stroke="#2b7bc0">
      <polyline points="385,798 385,1019 410,1019" marker-end="url(#sm)"/>
      <line x1="385" y1="915" x2="410" y2="915" marker-end="url(#sm)"/>
      <line x1="385" y1="967" x2="410" y2="967" marker-end="url(#sm)"/>
      <polyline points="671,798 671,967 696,967" marker-end="url(#sm)"/>
      <line x1="671" y1="915" x2="696" y2="915" marker-end="url(#sm)"/>
      <polyline points="957,798 957,915 982,915" marker-end="url(#sm)"/>
    </g>
    <g stroke="#3c9a3c">
      <polyline points="1249,798 1249,1019 1274,1019" marker-end="url(#sm)"/>
      <line x1="1249" y1="915" x2="1274" y2="915" marker-end="url(#sm)"/>
      <line x1="1249" y1="967" x2="1274" y2="967" marker-end="url(#sm)"/>
    </g>
    <g stroke="#d4a72c">
      <polyline points="1845,798 1845,1019 1870,1019" marker-end="url(#sm)"/>
      <line x1="1845" y1="915" x2="1870" y2="915" marker-end="url(#sm)"/>
      <line x1="1845" y1="967" x2="1870" y2="967" marker-end="url(#sm)"/>
      <polyline points="2160,798 2160,915 2185,915" marker-end="url(#sm)"/>
    </g>
  </g>
  <g font-size="25" fill="#3a4556">
    <text x="425" y="924">Customer orders</text>
    <text x="425" y="976">Production orders</text>
    <text x="425" y="1028">Purchasing orders</text>
    <text x="711" y="924">Component stock</text>
    <text x="711" y="976">Product stock</text>
    <text x="997" y="924">Vendors</text>
    <text x="1289" y="924">Logistics process</text>
    <text x="1289" y="976">Purchasing process</text>
    <text x="1289" y="1028">…other sub-processes</text>
    <text x="1885" y="924">Station status</text>
    <text x="1885" y="976">Environmental status</text>
    <text x="1885" y="1028">Factory production status</text>
    <text x="2200" y="924">High-bay warehouse stock</text>
  </g>
</svg>
